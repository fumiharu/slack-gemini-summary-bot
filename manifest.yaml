display_information:
  name: Summary Bot
  description: A bot that summarizes threads using Gemini when a reaction is added.
  background_color: "#000000"
features:
  bot_user:
    display_name: Summary Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - reactions:read
      - chat:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://YOUR_REGION-YOUR_PROJECT_ID.cloudfunctions.net/YOUR_FUNCTION_NAME
    bot_events:
      - reaction_added
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
